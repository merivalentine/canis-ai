<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canis AI — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <img src="assets/logo.png" alt="Canis AI" onerror="this.style.display='none'">
      </div>
      <div class="sidebar-icons">
        <a href="inbox.html" class="sidebar-icon" title="Inbox">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 8l9 6 9-6M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button class="sidebar-icon active" title="Dashboard">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 3v18h18M7 15l4-6 3 4 5-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a href="threats.html" class="sidebar-icon" title="Threats">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <div class="sidebar-bottom">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <span class="theme-icon-light">☀</span>
          <span class="theme-icon-dark">☾</span>
        </button>
      </div>
    </nav>

    <div class="app-main">
      <header class="topbar-inbox">
        <div class="brand">
          <span class="brand-name">Canis AI</span>
          <span class="brand-sub">Dashboard</span>
        </div>
        <div class="topbar-actions">
          <a href="inbox.html" class="btn-secondary">Go to Inbox</a>
          <div class="account-menu">
            <button class="account-btn" id="accountBtn" aria-label="Account menu">M</button>
            <div class="account-dropdown" id="accountDropdown">
              <a href="http://localhost:8000/auth/logout" class="account-dropdown-item">Log out</a>
            </div>
          </div>
        </div>
      </header>

      <main class="content-single">
        <h2 class="dash-title" id="dashTitle">Dashboard</h2>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-number" id="totalScanned">—</div>
            <div class="stat-label" id="statTotal">Total Scanned</div>
          </div>
          <div class="stat-card low">
            <div class="stat-number" id="lowCount">—</div>
            <div class="stat-label" id="statLow">Low</div>
          </div>
          <div class="stat-card medium">
            <div class="stat-number" id="mediumCount">—</div>
            <div class="stat-label" id="statMedium">Medium</div>
          </div>
          <div class="stat-card high">
            <div class="stat-number" id="highCount">—</div>
            <div class="stat-label" id="statHigh">High</div>
          </div>
          <div class="stat-card critical">
            <div class="stat-number" id="criticalCount">—</div>
            <div class="stat-label" id="statCritical">Critical</div>
          </div>
        </div>

        <section class="panel history-panel">
          <h2 id="recentTitle">Recent Scans</h2>
          <div id="historyList"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
